<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart - Blog Store</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --pink-light: #ffe6f2;
            --pink-medium: #ff66b2;
            --pink-dark: #cc3385;
            --text-dark: #660033;
        }
        body {
            background: linear-gradient(135deg, #fff0f7 0%, #ffe6f2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar-pink {
            background: linear-gradient(to right, var(--pink-dark), var(--pink-medium));
        }
        .cart-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(255, 102, 178, 0.15);
            border: 2px solid #ffe6f2;
        }
        .cart-item {
            border-bottom: 2px dashed #ffe6f2;
            padding: 1.5rem 0;
        }
        .cart-item-img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 10px;
            background-color: #ffe6f2;
        }
        .quantity-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 2px solid var(--pink-medium);
            background: white;
            color: var(--pink-medium);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .quantity-input {
            width: 50px;
            text-align: center;
            border: 2px solid #ffe6f2;
            border-radius: 8px;
        }
        .remove-btn {
            color: var(--pink-medium);
            background: none;
            border: none;
        }
        .pink-btn {
            background-color: var(--pink-medium);
            border: none;
            color: white;
            padding: 12px 30px;
            border-radius: 25px;
            font-weight: bold;
            transition: all 0.3s;
        }
        .pink-btn:hover {
            background-color: var(--pink-dark);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(204, 51, 133, 0.3);
        }
        .total-box {
            background: linear-gradient(135deg, #ffe6f2 0%, #ffd6eb 100%);
            border-radius: 15px;
            padding: 20px;
            border: 2px solid var(--pink-medium);
        }
        .euro-price {
            color: var(--pink-medium);
            font-weight: bold;
        }
        .euro-price::before {
            content: "€";
            margin-right: 2px;
        }
        .empty-cart {
            color: var(--text-dark);
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-pink">
        <div class="container">
            <a class="navbar-brand fw-bold" href="home.html">
                <i class="fas fa-blog me-2"></i>Blog Store
            </a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="home.html">
                            <i class="fas fa-home me-1"></i>Home
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="products.html">
                            <i class="fas fa-store me-1"></i>Products
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="cart.html">
                            <i class="fas fa-shopping-cart me-1"></i>Cart
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="payment.html">
                            <i class="fas fa-credit-card me-1"></i>Checkout
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <h1 class="text-center mb-5" style="color: var(--text-dark);">
            <i class="fas fa-shopping-cart me-2"></i>Your Shopping Cart
        </h1>
        
        <!-- Back buttons -->
        <div class="mb-4">
            <a href="products.html" class="btn btn-outline-primary me-2">
                <i class="fas fa-arrow-left me-2"></i>Back to Products
            </a>
            <a href="home.html" class="btn btn-outline-secondary">
                <i class="fas fa-home me-2"></i>Back to Home
            </a>
        </div>
        
        <!-- Currency notice -->
        <div class="alert alert-info mb-4">
            <i class="fas fa-euro-sign me-2"></i>
            All prices in <strong>Euros (€)</strong> | Free shipping on orders over €50
        </div>
        
        <div class="row">
            <div class="col-lg-8">
                <div class="cart-container p-4 mb-4">
                    <div id="cartItems">
                        <!-- Cart items load here -->
                    </div>
                </div>
            </div>
            
            <div class="col-lg-4">
                <div class="cart-container p-4">
                    <h4 class="mb-4" style="color: var(--text-dark);">
                        <i class="fas fa-euro-sign me-2"></i>Order Summary
                    </h4>
                    <div class="total-box mb-4">
                        <div class="d-flex justify-content-between mb-2">
                            <span>Subtotal:</span>
                            <span class="euro-price" id="subtotal">0.00</span>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span>Shipping:</span>
                            <span class="euro-price" id="shipping">5.00</span>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span>VAT (20%):</span>
                            <span class="euro-price" id="vat">0.00</span>
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between fw-bold fs-5">
                            <span>Total:</span>
                            <span class="euro-price" id="total">0.00</span>
                        </div>
                    </div>
                    <a href="payment.html" class="btn pink-btn w-100 mb-3">
                        <i class="fas fa-lock me-2"></i>Proceed to Checkout (€)
                    </a>
                    <button id="clearCart" class="btn btn-outline-danger w-100">
                        <i class="fas fa-trash me-2"></i>Clear Cart
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Use same localStorage key as products.html
        let cart = JSON.parse(localStorage.getItem('blogCart')) || [];

        function loadCart() {
            const container = document.getElementById('cartItems');
            
            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="text-center empty-cart py-5">
                        <i class="fas fa-shopping-cart fa-4x mb-3" style="color: #ffb3d9;"></i>
                        <h3>Your cart is empty</h3>
                        <p class="text-muted">Add some products from our store</p>
                        <a href="products.html" class="btn pink-btn mt-3">
                            <i class="fas fa-store me-2"></i>Shop Now
                        </a>
                    </div>
                `;
                updateTotals();
                return;
            }

            container.innerHTML = '';
            cart.forEach(item => {
                const itemImage = item.image || 'https://images.unsplash.com/photo-1583743814966-8936f5b7be1a?w=200&h=200&fit=crop';
                const itemPrice = item.price || 0;
                const itemQuantity = item.quantity || 1;
                const itemTotal = itemPrice * itemQuantity;
                
                container.innerHTML += `
                    <div class="cart-item row align-items-center">
                        <div class="col-3">
                            <img src="${itemImage}" class="cart-item-img" alt="${item.name}">
                        </div>
                        <div class="col-5">
                            <h6 class="fw-bold" style="color: var(--text-dark);">${item.name}</h6>
                            <p class="euro-price mb-0">${itemPrice.toFixed(2)} each</p>
                        </div>
                        <div class="col-3">
                            <div class="d-flex align-items-center">
                                <button class="quantity-btn decrease" data-id="${item.id}">-</button>
                                <input type="number" class="quantity-input mx-2" value="${itemQuantity}" min="1" data-id="${item.id}">
                                <button class="quantity-btn increase" data-id="${item.id}">+</button>
                            </div>
                        </div>
                        <div class="col-1">
                            <button class="remove-btn remove" data-id="${item.id}" title="Remove item">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                    </div>
                `;
            });

            // Add event listeners
            document.querySelectorAll('.decrease').forEach(btn => {
                btn.addEventListener('click', function() {
                    updateQuantity(parseInt(this.dataset.id), -1);
                });
            });

            document.querySelectorAll('.increase').forEach(btn => {
                btn.addEventListener('click', function() {
                    updateQuantity(parseInt(this.dataset.id), 1);
                });
            });

            document.querySelectorAll('.remove').forEach(btn => {
                btn.addEventListener('click', function() {
                    removeItem(parseInt(this.dataset.id));
                });
            });

            updateTotals();
        }

        function updateQuantity(productId, change) {
            const item = cart.find(item => item.id === productId);
            if (item) {
                item.quantity += change;
                if (item.quantity < 1) item.quantity = 1;
                localStorage.setItem('blogCart', JSON.stringify(cart));
                loadCart();
                showNotification(`Quantity updated to ${item.quantity}`);
            }
        }

        function removeItem(productId) {
            cart = cart.filter(item => item.id !== productId);
            localStorage.setItem('blogCart', JSON.stringify(cart));
            loadCart();
            showNotification('Item removed from cart');
        }

        function updateTotals() {
            // Calculate subtotal in Euros
            const subtotal = cart.reduce((sum, item) => {
                const price = item.price || 0;
                const quantity = item.quantity || 1;
                return sum + (price * quantity);
            }, 0);
            
            // Shipping: free over €50
            const shipping = subtotal >= 50 ? 0 : 5.00;
            
            // Calculate VAT (20% for Europe)
            const vatRate = 0.20; // 20% VAT
            const vat = subtotal * vatRate;
            
            // Total including shipping and VAT
            const total = subtotal + shipping + vat;
            
            // Update display
            document.getElementById('subtotal').textContent = subtotal.toFixed(2);
            document.getElementById('vat').textContent = vat.toFixed(2);
            document.getElementById('total').textContent = total.toFixed(2);
            
            // Update shipping display
            const shippingElement = document.getElementById('shipping');
            if (shipping === 0) {
                shippingElement.innerHTML = '<span class="text-success">0.00 <small>(Free shipping!)</small></span>';
            } else {
                shippingElement.textContent = shipping.toFixed(2);
            }
        }

        function showNotification(message) {
            const notification = document.createElement('div');
            notification.className = 'position-fixed bottom-0 end-0 p-3';
            notification.style.zIndex = '1060';
            
            notification.innerHTML = `
                <div class="toast show" role="alert">
                    <div class="toast-header" style="background-color: var(--pink-medium); color: white;">
                        <strong class="me-auto"><i class="fas fa-info-circle me-1"></i>Notification</strong>
                        <button type="button" class="btn-close btn-close-white" onclick="this.parentElement.parentElement.parentElement.remove()"></button>
                    </div>
                    <div class="toast-body">
                        ${message}
                    </div>
                </div>
            `;
            
            document.body.appendChild(notification);
            
            setTimeout(() => {
                if (notification.parentNode) {
                    notification.remove();
                }
            }, 3000);
        }

        // Clear cart button
        document.getElementById('clearCart').addEventListener('click', () => {
            if (cart.length > 0) {
                if (confirm('Are you sure you want to clear your cart?')) {
                    cart = [];
                    localStorage.setItem('blogCart', JSON.stringify(cart));
                    loadCart();
                    showNotification('Cart cleared');
                }
            } else {
                showNotification('Cart is already empty');
            }
        });

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', loadCart);
    </script>
</body>
</html>
