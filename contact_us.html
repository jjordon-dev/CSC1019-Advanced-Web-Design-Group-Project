<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Us</title>
  <link rel="stylesheet" href="style.css">
  <style>

    .contact-wrapper{
      margin: 30px auto;
      background: #fff8fa;
      border: 2px dotted #ffb5d5;
      border-radius: 12px;
      padding: 20px;
      width: 600px;
      box-shadow: 0 0 50px rgba(255, 0, 200, 0.2);
      text-align: center;
    }

    h2{
      font-family: "Press Start 2P";
      font-size: 16px;
      color: #d63d9c;
      margin-bottom: 20px;
    }

    .form-input{
      width: 90%;
      padding: 8px;
      margin: 6px 0;
      border-radius: 6px;
      border: 1.5px solid #ffb5d5;
      background: #fff0f9;
      font-family: monospace;
    }

    textarea{
      resize: none;
      height: 110px;
    }

    .submit-btn{
      background: linear-gradient(#ffedf9, #ffdcee);
      border: 2px solid #ffb5d5;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 14px;
      font-family: "Press Start 2P";
      color: #d63d9c;
      cursor: pointer;
      transition: 0.25s;
      margin-top: 10px;
    }

    .submit-btn:hover{
      background: white;
      transform: translateY(-2px);
    }

    
    .return-home {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: #fff8fa;
  border: 2px dotted #ffb5d5;
  border-radius: 12px;
  padding: 10px 20px;
  text-align: center;
  box-shadow: 0 0 30px rgba(255, 0, 200, 0.2);
  cursor: pointer;
  transition: transform 0.25s ease, background 0.25s ease;
}

.return-home a {
  text-decoration: none;
  font-family: "Press Start 2P";
  font-size: 16px;
  color: #d63d9c;
}

.return-home:hover {
  background: white;
  animation: bounce 0.25s ease forwards;
}

  </style>
</head>
<body>

<div class="page">
  <div class="contact-wrapper">
    <h2>Contact Us 💌</h2>
    <form>
      <input class="form-input" type="text" placeholder="Your Name" required>
      <input class="form-input" type="email" placeholder="Your Email" required>
      <textarea class="form-input" placeholder="Your Message" required></textarea>
      <button class="submit-btn" type="submit">Send ✨</button>
    </form>
  </div>
</div>

<!-- Return to Homepage Button -->
<div class="return-home">
  <a href="home.html">💌 Return to Homepage</a>
</div>

</body>
</html>
