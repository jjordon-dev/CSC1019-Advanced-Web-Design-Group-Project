<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Merch Clothing</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Arial", sans-serif;
        background-color: #0a0a0a;
        color: #e0e0e0;
        line-height: 1.6;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 20px;
      }

      header {
        background: linear-gradient(to right, #1a1a1a, #2a1a2a);
        padding: 20px 0;
        box-shadow: 0 2px 20px rgba(255, 20, 147, 0.15);
        position: sticky;
        top: 0;
        z-index: 1000;
        border-bottom: 2px solid #ff1493;
      }

      .header-content {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .logo {
        font-size: 28px;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 10px;
        color: #ff1493;
        text-shadow: 0 0 10px rgba(255, 20, 147, 0.5);
        text-decoration: none;
      }

      nav ul {
        display: flex;
        list-style: none;
        gap: 25px;
      }

      nav a {
        color: #e0e0e0;
        text-decoration: none;
        font-weight: 500;
        padding: 8px 15px;
        border-radius: 20px;
        transition: all 0.3s ease;
      }

      nav a:hover,
      nav a.active {
        background-color: #ff1493;
        color: #ffffff;
        box-shadow: 0 0 15px rgba(255, 20, 147, 0.5);
      }

      .cart-icon {
        position: relative;
        cursor: pointer;
        font-size: 22px;
        color: #ff1493;
        transition: all 0.3s ease;

        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 16px;
        background: linear-gradient(135deg, #2a1a2a, #3a1a3a);
        border-radius: 20px;
        border: 1px solid #ff1493;
      }

      .cart-icon::before {
        content: "🛒";
        font-size: 20px;
      }

      .cart-icon:hover {
        background: linear-gradient(135deg, #ff1493, #ff69b4);
        color: #ffffff;
      }

      .cart-count {
        position: absolute;
        top: -8px;
        right: -8px;
        background-color: #ff1493;
        color: #ffffff;
        border-radius: 50%;
        width: 20px;
        height: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: bold;
        box-shadow: 0 0 10px #ff1493;
      }

      main {
        padding: 40px 0;
        min-height: calc(100vh - 180px);
      }

      .page-title {
        text-align: center;
        margin-bottom: 40px;
        color: #ff1493;
        font-size: 36px;
        position: relative;
      }

      .page-title:after {
        content: "";
        position: absolute;
        width: 100px;
        height: 3px;
        background: linear-gradient(90deg, transparent, #ff1493, transparent);
        bottom: -10px;
        left: 50%;
        transform: translateX(-50%);
      }

      .merch-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 30px;
        margin-bottom: 50px;
      }

      .merch-item {
        background: linear-gradient(145deg, #1a1a1a, #2a1a2a);
        border-radius: 15px;
        overflow: hidden;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
        transition: all 0.3s ease;
        border: 2px solid transparent;
        cursor: pointer;
      }

      .merch-item:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 25px rgba(255, 20, 147, 0.2);
        border-color: #ff1493;
      }

      .merch-img {
        height: 200px;
        width: 100%;
        overflow: hidden;
        position: relative;
        background: linear-gradient(135deg, #2a1a2a, #3a1a3a);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .merch-img img {
        max-width: 90%;
        max-height: 90%;
        object-fit: contain;
        transition: transform 0.5s ease;
      }

      .merch-item:hover .merch-img img {
        transform: scale(1.05);
      }

      .merch-info {
        padding: 20px;
      }

      .merch-name {
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 8px;
        color: #ffffff;
      }

      .merch-desc {
        color: #b0b0b0;
        font-size: 14px;
        margin-bottom: 15px;
        height: 40px;
        overflow: hidden;
      }

      .merch-price {
        font-size: 20px;
        font-weight: 700;
        color: #ff1493;
        margin-bottom: 15px;
      }

      .product-detail-page {
        display: none;
      }

      .product-detail-page.active {
        display: block;
      }

      .back-btn {
        background: #2a1a2a;
        color: #ff69b4;
        border: 1px solid #ff1493;
        padding: 10px 20px;
        border-radius: 20px;
        cursor: pointer;
        margin-bottom: 30px;
        transition: all 0.3s ease;
      }

      .back-btn:hover {
        background: #ff1493;
        color: #ffffff;
      }

      .product-container {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 40px;
        background: linear-gradient(145deg, #1a1a1a, #2a1a2a);
        border-radius: 20px;
        padding: 30px;
        border: 2px solid #ff1493;
      }

      .product-image {
        width: 100%;
        height: 400px;
        background: linear-gradient(135deg, #2a1a2a, #3a1a3a);
        border-radius: 15px;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .product-image img {
        max-width: 90%;
        max-height: 90%;
        object-fit: contain;
      }

      .product-info h1 {
        font-size: 32px;
        color: #ffffff;
        margin-bottom: 10px;
      }

      .product-price {
        font-size: 28px;
        color: #ff1493;
        margin-bottom: 20px;
        font-weight: 700;
      }

      .product-description {
        color: #b0b0b0;
        line-height: 1.8;
        margin-bottom: 25px;
      }

      .size-guide {
        margin: 25px 0;
        border-top: 2px solid #ff1493;
        padding-top: 20px;
      }

      .size-guide h3 {
        color: #ffffff;
        margin-bottom: 15px;
      }

      .size-buttons {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
      }

      .size-btn {
        padding: 10px 20px;
        background: #2a1a2a;
        border: 1px solid #ff1493;
        color: #e0e0e0;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .size-btn:hover {
        background: #ff1493;
        color: #ffffff;
      }

      .size-btn.selected {
        background: #ff1493;
        color: #ffffff;
      }

      .size-chart {
        background: #1a1a1a;
        border-radius: 10px;
        padding: 20px;
        border: 1px solid #ff1493;
      }

      .size-chart table {
        width: 100%;
        border-collapse: collapse;
      }

      .size-chart th {
        background: #ff1493;
        color: #ffffff;
        padding: 12px;
        text-align: left;
      }

      .size-chart td {
        padding: 12px;
        border: 1px solid #3a2a3a;
      }

      .product-actions {
        display: flex;
        gap: 15px;
        margin-top: 30px;
      }

      .add-to-cart-detail {
        background: linear-gradient(135deg, #ff1493, #ff69b4);
        color: #ffffff;
        border: none;
        padding: 15px 30px;
        border-radius: 10px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .add-to-cart-detail:hover {
        box-shadow: 0 0 20px rgba(255, 20, 147, 0.5);
      }

      .cart-sidebar {
        position: fixed;
        top: 0;
        right: -400px;
        width: 380px;
        height: 100vh;
        background: linear-gradient(180deg, #1a1a1a 0%, #2a1a2a 100%);
        box-shadow: -5px 0 15px rgba(0, 0, 0, 0.7);
        z-index: 1001;
        transition: right 0.4s ease;
        display: flex;
        flex-direction: column;
        border-left: 3px solid #ff1493;
      }

      .cart-sidebar.active {
        right: 0;
      }

      .cart-header {
        background: linear-gradient(to right, #ff1493, #ff69b4);
        color: #ffffff;
        padding: 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .cart-header h2 {
        font-size: 22px;
      }

      .close-cart {
        background: none;
        border: none;
        color: #ffffff;
        font-size: 24px;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .close-cart:hover {
        transform: scale(1.1);
      }

      .cart-items {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
      }

      .cart-item {
        display: flex;
        gap: 15px;
        padding: 15px 0;
        border-bottom: 1px solid #3a2a3a;
      }

      .cart-item-img {
        width: 60px;
        height: 60px;
        border-radius: 8px;
        overflow: hidden;
        flex-shrink: 0;
        background: linear-gradient(135deg, #2a1a2a, #3a1a3a);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .cart-item-img img {
        max-width: 80%;
        max-height: 80%;
        object-fit: contain;
      }

      .cart-item-details {
        flex: 1;
      }

      .cart-item-name {
        font-weight: 600;
        margin-bottom: 5px;
        color: #ffffff;
      }

      .cart-item-price {
        color: #ff69b4;
        font-weight: 600;
        margin-bottom: 8px;
      }

      .cart-item-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .remove-item {
        background: none;
        border: none;
        color: #ff6b6b;
        cursor: pointer;
        font-size: 13px;
        transition: all 0.3s ease;
      }

      .remove-item:hover {
        color: #ff3333;
      }

      .cart-footer {
        padding: 20px;
        border-top: 2px solid #ff1493;
        background: #1a1a1a;
      }

      .cart-total {
        display: flex;
        justify-content: space-between;
        font-size: 20px;
        font-weight: 700;
        margin-bottom: 20px;
        color: #ff1493;
      }

			#home {
				position: fixed;
				top: 10px;
				left: 10px;
				color: white;
				font-size: 16px;
				text-decoration: none;
				border: 2px solid white;
				padding: 5px 9px;
				border-radius: 6px;
				background: rgba(0,0,0,0.4);
			}	

      .checkout-btn {
        width: 100%;
        padding: 12px;
        background: linear-gradient(to right, #ff1493, #ff69b4);
        color: #ffffff;
        border: none;
        border-radius: 25px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .checkout-btn:hover {
        box-shadow: 0 0 20px rgba(255, 20, 147, 0.5);
      }

      footer {
        background: linear-gradient(to right, #1a1a1a, #2a1a2a);
        color: #e0e0e0;
        padding: 20px 0;
        text-align: center;
        border-top: 2px solid #ff1493;
      }

      @media (max-width: 768px) {
        .header-content {
          flex-direction: column;
          gap: 15px;
        }

        nav ul {
          flex-wrap: wrap;
          justify-content: center;
          gap: 10px;
        }

        .merch-grid {
          grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        }

        .product-container {
          grid-template-columns: 1fr;
        }

        .cart-sidebar {
          width: 100%;
          right: -100%;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="container header-content">
        <div class="logo">
          <i class="fas fa-heart"></i>
          Merch Shop
        </div>
        <nav>
          <ul>
            <li><a href="#" class="active">Shop</a></li>
          </ul>
        </nav>
        <div class="cart-icon" id="cartIcon">
          <i class="fas fa-shopping-cart"></i>
          <span class="cart-count" id="cartCount">0</span>
        </div>
      </div>
			<a href="home.html" id="home">Home</a>

    </header>

    <main class="container">
      <div id="shopPage">
        <h1 class="page-title">Merch shop collection</h1>
        <div class="merch-grid" id="merchGrid"></div>
      </div>

      <div class="product-detail-page" id="productDetailPage">
        <button class="back-btn" onclick="goBack()">← Back to Shop</button>
        <div class="product-container" id="productContainer"></div>
      </div>
    </main>

    <div class="cart-sidebar" id="cartSidebar">
      <div class="cart-header">
        <h2>Your Shopping Cart</h2>
        <button class="close-cart" id="closeCart">
          <i class="fas fa-times"></i>
        </button>
      </div>

      <div class="cart-items" id="cartItems"></div>

      <div class="cart-footer">
        <div class="cart-total">
          <span>Total:</span>
          <span id="cartTotal">€0.00</span>
        </div>
        <button class="checkout-btn">Proceed to Checkout</button>
      </div>
    </div>

    <footer>
      <div class="container">
        <p>&copy; Merch Shop Collection</p>
      </div>
    </footer>

    <script>
      const merchItems = [
        {
          id: 1,
          name: "T-Shirt",
          description: "Premium cotton t-shirt",
          detailedDescription:
            "This premium t-shirt is made from 100% organic cotton, offering maximum comfort and breathability.",
          price: 24.99,
          image: "t-shirt.jpg",
        },
        {
          id: 2,
          name: "Shirt",
          description: "Elegant button-up with pink accents",
          detailedDescription:
            "This sophisticated button-up shirt combines gothic aesthetics with subtle pink accents. Made from a premium cotton-polyester blend.",
          price: 34.99,
          image: "Shirt.jpg",
        },
        {
          id: 3,
          name: "Tie",
          description: "Luxurious velvet tie",
          detailedDescription:
            "Handcrafted from premium velvet, this tie exudes luxury and sophistication.",
          price: 9.99,
          image: "tie.jpg",
        },
        {
          id: 4,
          name: "Jeans",
          description: "Light Blue jeans with kisses",
          detailedDescription:
            "These light blue jeans that adds a unique touch to classic denim. Made from stretch denim for comfort.",
          price: 44.99,
          image: "jeans.jpg",
        },
        {
          id: 5,
          name: "Hoodie",
          description: "Heavyweight hoodie with kisses print",
          detailedDescription:
            "This heavyweight hoodie combines comfort with style. The creme-colour fabric features pink details.",
          price: 44.99,
          image: "Hoodie.jpg",
        },
        {
          id: 6,
          name: "Jeans",
          description: "Light blue jeans with pink details",
          detailedDescription:
            "These black skinny jeans feature pink drawing and stitching details that make them stand out. Made from a comfortable stretch fabric.",
          price: 59.99,
          image: "jeans3.jpg",
        },
      ];

      let cart = [];
      let currentProduct = null;

      const merchGrid = document.getElementById("merchGrid");
      const shopPage = document.getElementById("shopPage");
      const productDetailPage = document.getElementById("productDetailPage");
      const productContainer = document.getElementById("productContainer");
      const cartIcon = document.getElementById("cartIcon");
      const cartCount = document.getElementById("cartCount");
      const cartSidebar = document.getElementById("cartSidebar");
      const closeCart = document.getElementById("closeCart");
      const cartItems = document.getElementById("cartItems");
      const cartTotal = document.getElementById("cartTotal");

      document.addEventListener("DOMContentLoaded", function () {
        renderMerchItems();
        updateCartCount();

        const savedCart = localStorage.getItem("pinkNoirCart");
        if (savedCart) {
          cart = JSON.parse(savedCart);
          updateCartDisplay();
        }
      });

      function renderMerchItems() {
        merchGrid.innerHTML = "";

        merchItems.forEach((item) => {
          const merchItem = document.createElement("div");
          merchItem.className = "merch-item";
          merchItem.innerHTML = `
                    <div class="merch-img">
                        <img src="${item.image}" alt="${item.name}">
                    </div>
                    <div class="merch-info">
                        <h3 class="merch-name">${item.name}</h3>
                        <p class="merch-desc">${item.description}</p>
                        <div class="merch-price">€${item.price.toFixed(2)}</div>
                    </div>
                `;

          merchItem.addEventListener("click", () => showProductDetail(item));
          merchGrid.appendChild(merchItem);
        });
      }

      function showProductDetail(product) {
        currentProduct = product;

        let sizeChart = "";
        if (
          product.name.includes("T-Shirt") ||
          product.name.includes("Hoodie")
        ) {
          sizeChart = `
                    <div class="size-guide">
                        <h3>Size Guide</h3>
                        <div class="size-buttons">
                            <button class="size-btn" onclick="selectSize('XS')">XS</button>
                            <button class="size-btn" onclick="selectSize('S')">S</button>
                            <button class="size-btn" onclick="selectSize('M')">M</button>
                            <button class="size-btn" onclick="selectSize('L')">L</button>
                            <button class="size-btn" onclick="selectSize('XL')">XL</button>
                        </div>
                        <div class="size-chart">
                            <table>
                                <tr>
                                    <th>Size</th>
                                    <th>Chest (in)</th>
                                    <th>Length (in)</th>
                                </tr>
                                <tr><td>XS</td><td>34-36</td><td>26</td></tr>
                                <tr><td>S</td><td>36-38</td><td>27</td></tr>
                                <tr><td>M</td><td>38-40</td><td>28</td></tr>
                                <tr><td>L</td><td>40-42</td><td>29</td></tr>
                                <tr><td>XL</td><td>42-44</td><td>30</td></tr>
                            </table>
                        </div>
                    </div>
                `;
        } else if (product.name.includes("Jeans")) {
          sizeChart = `
                    <div class="size-guide">
                        <h3>Size Guide</h3>
                        <div class="size-buttons">
                            <button class="size-btn" onclick="selectSize('28')">28</button>
                            <button class="size-btn" onclick="selectSize('30')">30</button>
                            <button class="size-btn" onclick="selectSize('32')">32</button>
                            <button class="size-btn" onclick="selectSize('34')">34</button>
                            <button class="size-btn" onclick="selectSize('36')">36</button>
                        </div>
                        <div class="size-chart">
                            <table>
                                <tr>
                                    <th>Waist</th>
                                    <th>Inseam</th>
                                    <th>Leg Opening</th>
                                </tr>
                                <tr><td>28</td><td>32</td><td>14</td></tr>
                                <tr><td>30</td><td>32</td><td>14</td></tr>
                                <tr><td>32</td><td>32</td><td>14.5</td></tr>
                                <tr><td>34</td><td>32</td><td>14.5</td></tr>
                                <tr><td>36</td><td>32</td><td>15</td></tr>
                            </table>
                        </div>
                    </div>
                `;
        }

        productContainer.innerHTML = `
                <div class="product-image">
                    <img src="${product.image}" alt="${product.name}">
                </div>
                <div class="product-info">
                    <h1>${product.name}</h1>
                    <div class="product-price">€${product.price.toFixed(
                      2
                    )}</div>
                    <p class="product-description">${
                      product.detailedDescription
                    }</p>
                    ${sizeChart}
                    <div class="product-actions">
                        <button class="add-to-cart-detail" onclick="addToCartFromDetail()">Add to Cart</button>
                    </div>
                </div>
            `;

        shopPage.style.display = "none";
        productDetailPage.classList.add("active");
      }

      function selectSize(size) {
        document.querySelectorAll(".size-btn").forEach((btn) => {
          btn.classList.remove("selected");
        });
        event.target.classList.add("selected");
      }

      function goBack() {
        shopPage.style.display = "block";
        productDetailPage.classList.remove("active");
      }

      function addToCartFromDetail() {
        const selectedSizeBtn = document.querySelector(".size-btn.selected");
        const size = selectedSizeBtn ? selectedSizeBtn.textContent : "One Size";

        cart.push({
          id: currentProduct.id,
          name: currentProduct.name,
          price: currentProduct.price,
          image: currentProduct.image,
          size: size,
          quantity: 1,
        });

        updateCartCount();
        updateCartDisplay();
        saveCart();
        showFeedback(`${currentProduct.name} (${size}) added to cart!`);
      }

      function updateCartCount() {
        cartCount.textContent = cart.length;
      }

      function updateCartDisplay() {
        cartItems.innerHTML = "";
        let total = 0;

        if (cart.length === 0) {
          cartItems.innerHTML =
            '<p style="text-align: center; color: #b0b0b0;">Your cart is empty</p>';
        } else {
          cart.forEach((item, index) => {
            total += item.price * item.quantity;
            const cartItem = document.createElement("div");
            cartItem.className = "cart-item";
            cartItem.innerHTML = `
                        <div class="cart-item-img">
                            <img src="${item.image}" alt="${item.name}">
                        </div>
                        <div class="cart-item-details">
                            <h4 class="cart-item-name">${item.name}</h4>
                            <div class="cart-item-price">€${item.price.toFixed(
                              2
                            )} (${item.size})</div>
                            <div class="cart-item-actions">
                                <button class="remove-item" onclick="removeFromCart(${index})">Remove</button>
                            </div>
                        </div>
                    `;
            cartItems.appendChild(cartItem);
          });
        }

        cartTotal.textContent = `€${total.toFixed(2)}`;
      }

      function removeFromCart(index) {
        cart.splice(index, 1);
        updateCartCount();
        updateCartDisplay();
        saveCart();
      }

      function saveCart() {
        localStorage.setItem("pinkNoirCart", JSON.stringify(cart));
      }

      function showFeedback(message) {
        const feedback = document.createElement("div");
        feedback.textContent = message;
        feedback.style.cssText = `
                position: fixed;
                bottom: 20px;
                left: 50%;
                transform: translateX(-50%);
                background: #ff1493;
                color: white;
                padding: 12px 24px;
                border-radius: 25px;
                font-weight: 600;
                z-index: 1002;
                animation: fadeIn 0.3s ease;
            `;
        document.body.appendChild(feedback);

        setTimeout(() => {
          feedback.style.animation = "fadeOut 0.3s ease";
          setTimeout(() => feedback.remove(), 300);
        }, 2000);
      }

      cartIcon.addEventListener("click", () => {
        cartSidebar.classList.add("active");
      });

      closeCart.addEventListener("click", () => {
        cartSidebar.classList.remove("active");
      });

      document.addEventListener("click", (e) => {
        if (!cartSidebar.contains(e.target) && !cartIcon.contains(e.target)) {
          cartSidebar.classList.remove("active");
        }
      });
    </script>
  </body>
</html>
